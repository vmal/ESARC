name: Deploy

# Push to main deploys staging (staging.esarc.dev).
# A v* tag on main deploys production (esarc.dev).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      SITE_URL: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://esarc.dev' || 'https://staging.esarc.dev' }}
      # Read at build time by statically rendered pages.
      SITE_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Production tags must be on main
        if: env.DEPLOY_ENV == 'production'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run cf:build

      - name: Deploy
        run: npx opennextjs-cloudflare deploy --env "$DEPLOY_ENV"

      - name: Smoke test
        id: smoke
        run: node scripts/smoke.mjs "$SITE_URL"

      - name: Roll back on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: npx wrangler rollback --env "$DEPLOY_ENV" --message "Smoke test failed for $GITHUB_SHA"
